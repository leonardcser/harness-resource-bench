<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Harness resource bench moved to harness lab</title>
    <link
      rel="canonical"
      href="https://leonardcser.github.io/harness-lab/resources/"
    />
    <meta
      http-equiv="refresh"
      content="0; url=https://leonardcser.github.io/harness-lab/resources/"
    />
    <script>
      // A run page of the old site goes to the same run.
      const run = location.pathname.match(/\/runs\/([^/]+)/);
      location.replace(
        "https://leonardcser.github.io/harness-lab/" +
          (run ? "bench/runs/" + run[1] + "/" : "resources/") +
          location.hash,
      );
    </script>
  </head>
  <body>
    <p>
      The resource bench is now part of
      <a href="https://leonardcser.github.io/harness-lab/resources/"
        >harness lab</a
      >.
    </p>
  </body>
</html>
