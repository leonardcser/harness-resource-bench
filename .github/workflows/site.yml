# Deploys the redirect from the old site to harness lab: the root, a page for
# each frozen run, and a 404 page that covers every other old link.
name: Site

on:
  push:
    branches: [main]
    paths:
      - redirect/**
      - results/*/site/**
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the redirect pages
        run: |
          mkdir out
          cp redirect/index.html redirect/404.html out/
          for site in results/*/site; do
            id=$(basename "$(dirname "$site")")
            mkdir -p "out/runs/$id"
            sed "s/__ID__/$id/g" redirect/run.html > "out/runs/$id/index.html"
          done
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v5
