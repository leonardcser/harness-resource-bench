# Checks and builds the site on every change to it, and deploys it to GitHub
# Pages from main. The build includes the frozen page of each run.
name: Site

on:
  push:
    branches: [main]
    paths:
      - web/**
      - results/*.json
      - results/*/*.json
      - results/*/site/**
      - .github/workflows/site.yml
  pull_request:
    paths:
      - web/**
      - results/*.json
      - results/*/*.json
      - results/*/site/**
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Each frozen page links to the commit that measured its run.
      - name: Check that the commit of each run is in the history
        working-directory: .
        run: |
          for manifest in results/*/manifest.json; do
            commit=$(jq -r '.commit // empty' "$manifest")
            [ -z "$commit" ] || git merge-base --is-ancestor "$commit" HEAD ||
              { echo "::error file=$manifest::$commit is not in the history of HEAD"; exit 1; }
          done
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
