# Checks that the title of each pull request is a conventional commit, as it
# becomes the commit message when the pull request is squashed.
name: PR title

on:
  pull_request_target:
    types: [opened, reopened, edited]

permissions:
  contents: read

jobs:
  pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check conventional commit format
        uses: amannn/action-semantic-pull-request@v6
        with:
          # The same as the default, with a limit of 60 characters on the title.
          headerPattern: '^(?=.{1,60}$)(\w*)(?:\(([\w$.\-*/ ]*)\))?!?: (.*)$'
          headerPatternCorrespondence: type, scope, subject
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
